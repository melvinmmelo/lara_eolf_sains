services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eolf-app
    working_dir: /var/www
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
      - composer_vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: eolf-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - composer_vendor:/var/www/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: eolf-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: eolf_new
      MARIADB_USER: eolf
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  composer_vendor:
  node_modules:

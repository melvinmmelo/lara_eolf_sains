name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add host key
      run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "cd ${{ secrets.DEPLOY_PATH }} && \
        git fetch origin main && \
        git reset --hard origin/main && \
        composer install --no-dev --optimize-autoloader && \
        php artisan db:backup && \
        php artisan migrate --force && \
        php artisan optimize:clear && \
        php artisan config:cache && \
        php artisan route:cache && \
        php artisan view:cache"

  install-server-cron:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add host key
      run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

    - name: Install Laravel scheduler cron entry
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} bash <<EOF
        CRON_LINE="* * * * * cd ${{ secrets.DEPLOY_PATH }} && php artisan schedule:run >> /dev/null 2>&1"
        if crontab -l 2>/dev/null | grep -Fq 'schedule:run'; then
          echo "Cron entry already present:"
          crontab -l | grep schedule:run
          exit 0
        fi
        ( crontab -l 2>/dev/null; echo "\$CRON_LINE" ) | crontab -
        echo "Installed cron entry. Current crontab:"
        crontab -l
        EOF